name: G3 Workbook Inspect
on:
  push:
    branches: [migration/vhldl-structure]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Inspect Index.xlsx
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from pathlib import Path
          p=Path('index/Index.xlsx')
          wb=load_workbook(p, data_only=False, read_only=True)
          print('G3_WORKBOOK_INSPECTION')
          print('FILE', p)
          print('SHEETS', wb.sheetnames)
          for ws in wb.worksheets:
              rows=list(ws.iter_rows(values_only=True))
              nonempty=[r for r in rows if any(v is not None and v!='' for v in r)]
              header=nonempty[0] if nonempty else ()
              data=nonempty[1:] if len(nonempty)>1 else []
              print(f'SHEET={ws.title}')
              print(f'ROWS_NONEMPTY={len(nonempty)}')
              print(f'DATA_ROWS={len(data)}')
              print('HEADER='+repr(header))
          PY

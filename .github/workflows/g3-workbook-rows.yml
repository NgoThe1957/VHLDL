name: G3 Workbook Rows
on:
  push:
    branches: [migration/vhldl-structure]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Inspect rows
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          wb=load_workbook('index/Index.xlsx', data_only=False, read_only=True)
          for ws in wb.worksheets:
              rows=[r for r in ws.iter_rows(values_only=True) if any(v not in (None,'') for v in r)]
              print('\n###',ws.title,'###')
              print('HEADER',repr(rows[0]))
              for i,r in enumerate(rows[1:],1):
                  if ws.title in ('Books','Entities','CrossReference','QA'):
                      print(i,repr(r))
                  elif i<=5 or i>len(rows)-6:
                      print(i,repr(r))
          PY

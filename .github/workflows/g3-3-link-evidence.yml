name: G3.3 Link Evidence
on:
  push:
    branches:
      - migration/vhldl-structure
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact anchors, page evidence and cross-file links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re
          files = {'LSVN_001': Path('history/LSVN_001.md'), 'TTVHVN_039': Path('literature/TTVHVN_039.md')}
          anchors = {'LSVN_001': ['#pdf-page-144', '#pdf-page-145', '#pdf-page-146'], 'TTVHVN_039': ['#pdf-page-36']}
          out=[]
          for book,p in files.items():
              text=p.read_text(encoding='utf-8') if p.exists() else ''
              lines=text.splitlines()
              item={'book':book,'path':str(p),'exists':p.exists(),'size':len(text.encode('utf-8')),'anchors':{},'cross_file_links':[]}
              for a in anchors[book]:
                  pat=re.escape(a)+r'(?!\d)'
                  hits=[f'{i+1}: {line[:500]}' for i,line in enumerate(lines) if re.search(pat,line)]
                  item['anchors'][a]={'count':len(hits),'sample_lines':hits[:5]}
              for i,line in enumerate(lines,1):
                  for m in re.finditer(r'\[[^\]]+\]\(([^)]+)\)', line):
                      target=m.group(1)
                      if target.startswith('../') or target.startswith('./'):
                          item['cross_file_links'].append(f'{i}: {target}')
              out.append(item)
          targets=[('literature/TTVHVN_039.md','history/LSVN_001.md#pdf-page-145'),('literature/TTVHVN_039.md','history/LSVN_001.md#pdf-page-146')]
          for src,target in targets:
              p=Path(src); lines=p.read_text(encoding='utf-8').splitlines() if p.exists() else []
              exact=[f'{i}: {line[:1000]}' for i,line in enumerate(lines,1) if target in line]
              print(f'CROSSREF {src} -> {target}: {len(exact)}')
              for h in exact[:5]: print(h)
          Path('g3.3-evidence.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: g3-3-link-evidence
          path: g3.3-evidence.json
